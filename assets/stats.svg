<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img">
<style>
text{font-family:'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.grow{transform:scaleX(0);transform-origin:left;transform-box:fill-box;animation:gx .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes gx{to{transform:scaleX(1)}}
</style>
<rect x=".5" y=".5" width="879" height="299" rx="18" fill="#0e0e0e" stroke="#2a2a2a"/>
<text x="44" y="52" fill="#9a978f" font-size="14" class="rise">open source, by the numbers</text>
<g transform="translate(44 92)"><g class="rise" style="animation-delay:0.15s">
  <text x="0" y="0" fill="#f5b52e" font-size="40" font-weight="800" letter-spacing="-1">35</text>
  <text x="0" y="24" fill="#9a978f" font-size="13">merged pull requests</text></g></g>
<g transform="translate(44 158)"><g class="rise" style="animation-delay:0.3s">
